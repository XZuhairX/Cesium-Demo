//
//  What it does
//   - Loads your iModel "Cesium Container" (3D Tiles 6143512, database 6140816)
//   - FILES panel: every synced file with an on/off switch and its DGN levels;

//   - X-ray: off / on / close up only, plus a ground opacity slider
//   - Go underground at a spot you click, then "Back up" to return
//   - Clip ground: cuts the map/terrain under the model footprint (Clipping
//     assist 6143638) and keeps the grass inside the loops. Starts off.
//   - Cross-section: Place cut, Cut across road (square to the road), Face

//   - Wider click target so thin lines (alignments) are easy to hit
//   - "How?" buttons that explain every group, and a written banner telling you

document.head.appendChild(css);

const panel = document.createElement("div");
panel.id = "mi4";
document.body.appendChild(panel);
function el(tag, text, parent, cls) {
  const n = document.createElement(tag);
  if (text !== undefined) n.textContent = text;
  if (cls) n.className = cls;
  (parent || body).appendChild(n);
  return n;
}
// "i" button that opens/closes an explanation box under the title
function infoButton(parentTitle, html, insertAfter) {
  const b = el("button", "How?", parentTitle, "mi4i");
  b.title = "What do these buttons do?";
  const box = document.createElement("div");
  box.className = "mi4info";
  box.innerHTML = html;
  insertAfter.after(box);
  b.onclick = (e) => {
    e.stopPropagation();
    const open = !box.classList.contains("open");
    box.classList.toggle("open", open);
    b.classList.toggle("on", open);
  };
  return box;
}
const head = el("div", undefined, panel, "head");

}
const groundRow = section("Ground", INFO.ground);
const clipRow = section("Clip ground", INFO.clip);
const cutRow = section("Cross-section", INFO.cut);
const viewRow = section("View", INFO.view);
const viewsRow = section("Views", INFO.views);
const keys = section("Move", INFO.move);
keys.className = "keys";
keys.innerHTML = "<b>W</b><b>A</b><b>S</b><b>D</b> walk · <b>Q</b>/<b>E</b> down/up · arrows look · hold <b>Shift</b> = fast. Click the map first.";
const filesRow = section("Files", INFO.files);

search.type = "text";
search.placeholder = "Search levels…";
const fileList = el("div", undefined, filesRow);
section("Log");
const logBox = el("div", undefined, body);
logBox.id = "mi4Log";
el("div", TEAM_CREDIT, panel, "foot");

const t0 = performance.now();
function log(msg, kind) {
  const s = ((performance.now() - t0) / 1000).toFixed(1).padStart(5);
  const line = `[${s}s] ${msg}`;
  el("div", line, logBox, kind || "");
  logBox.scrollTop = logBox.scrollHeight;
  (kind === "e" ? console.error : kind === "w" ? console.warn : console.log)(line);
}

// ---------------- SECTION 3 · STATE ----------------
let viewer, tileset, elementService, globe;
const norm = (v) => (v === undefined || v === null ? undefined : BigInt(v).toString());
const files = [];                 // { label, color, cesiumColor, levels:[{id,label,row,cb}], details, cb, swatch }
const catToFile = new Map();      // categoryId -> file (level ids are unique per file)
const hiddenCats = new Set();     // categoryId
const catLabel = new Map();       // categoryId -> level name
const styledTilesets = [];        // main tileset + section-window tileset
let selectedElementId;
let colorByFile = false;
let colorBtnRef;
let activeClick = 0;
let pickMode = null;              // null | "cut" | "road1" | "road2" | "under" — what the next map click does
let clipCollection, clipBtnRef;   // Clip ground polygons (Section 8b)
let hintEl;
const goldenColor = Cesium.Color.fromCssColorString(RSH.golden);

function fileOf(feature) {
  return catToFile.get(norm(feature.getProperty("category")));
}
// The written banner at the top of the map ("Click the spot you want…")
function showHint(text, small) {
  if (!hintEl) return;
  hintEl.innerHTML = "";
  hintEl.appendChild(document.createTextNode(text));
  const s = document.createElement("small");
  s.textContent = small ?? "Press Esc to cancel";
  hintEl.appendChild(s);
  hintEl.style.display = "block";
}
function hideHint() {
  if (hintEl) hintEl.style.display = "none";
}
function setPickMode(mode, hint) {
  pickMode = mode;
  if (viewer) viewer.canvas.style.cursor = mode ? "crosshair" : "";
  if (mode && hint) showHint(hint);
  else hideHint();
}
function setColorByFile(on) {
  colorByFile = on;
  if (colorBtnRef) colorBtnRef.classList.toggle("on", on);
  files.forEach((f) => f.swatch && (f.swatch.style.outline = on ? `2px solid ${RSH.navy}` : "none"));
  refresh();
}

// ---------------- SECTION 4 · VIEWER + MODEL ----------------
try {
  log("Step 1/8 · Checking token…");
  if (!ION_TOKEN || ION_TOKEN.startsWith("PASTE_")) {
    throw new Error("No ion token. Paste yours into ION_TOKEN in Section 1 (ion > Access Tokens).");
  }
  Cesium.Ion.defaultAccessToken = ION_TOKEN;
  log("Token set.", "ok");

  log("Step 2/8 · Building viewer + world terrain…");
  viewer = new Cesium.Viewer("cesiumContainer", {
    timeline: false, animation: false, baseLayerPicker: false,
    terrain: Cesium.Terrain.fromWorldTerrain(),
    showRenderLoopErrors: false,   // we recover ourselves (see below)
  });
  globe = viewer.scene.globe;
  globe.depthTestAgainstTerrain = true;
  globe.translucency.enabled = false;
  globe.undergroundColor = Cesium.Color.fromCssColorString(RSH.navy);
  globe.undergroundColorAlphaByDistance.nearValue = 1.0;
  globe.undergroundColorAlphaByDistance.farValue = 1.0;

  // Auto-recovery: if Cesium stops drawing, turn Clip ground off and restart.
  viewer.scene.renderError.addEventListener((scene, err) => {
    log(`Cesium stopped drawing: ${err?.message ?? err}. Turning Clip ground off and restarting the view…`, "e");
    try { if (clipCollection) { clipCollection.enabled = false; setClipButtons(); } } catch (e) { /* ignore */ }
    setTimeout(() => { viewer.useDefaultRenderLoop = true; log("View restarted.", "ok"); }, 300);
  });

  // RS&H logo (bottom-right, solid with a soft white glow)
  const logo = document.createElement("img");
  logo.id = "mi4Logo";
  logo.src = RSH_LOGO;
  logo.alt = "RS&H";
  viewer.container.appendChild(logo);
  // Instruction banner
  hintEl = document.createElement("div");
  hintEl.id = "mi4Hint";
  viewer.container.appendChild(hintEl);
  log("Viewer ready.", "ok");

  log(`Step 3/8 · Loading tileset ${TILESET_ASSET_ID}…`);
  try {
    tileset = await Cesium.Cesium3DTileset.fromIonAssetId(TILESET_ASSET_ID);
  } catch (err) {
    throw new Error(`Couldn't load asset ${TILESET_ASSET_ID}: ${err.message}. ` +
      "Check the token can read this asset and that tiling reached 100%.");
  }
  viewer.scene.primitives.add(tileset);
  if (HEIGHT_NUDGE_METERS !== 0) {
    const c = Cesium.Cartographic.fromCartesian(tileset.boundingSphere.center);
    const a = Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, 0);
    const b = Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, HEIGHT_NUDGE_METERS);
    tileset.modelMatrix = Cesium.Matrix4.fromTranslation(Cesium.Cartesian3.subtract(b, a, new Cesium.Cartesian3()));
    log(`Height nudged ${HEIGHT_NUDGE_METERS} m.`);
  }
  await viewer.zoomTo(tileset);
  log("Tileset loaded.", "ok");

  // Level names from tileset metadata (backup labels if the tree has none)
  const md = tileset.metadata;
  const catIds = md && md.getProperty("categoryIds");
  const catNames = md && md.getProperty("categoryNames");
  if (catIds && catNames) catIds.forEach((id, i) => catLabel.set(norm(id), String(catNames[i])));
  log(`Tileset metadata: ${catLabel.size} level names.`, catLabel.size ? "ok" : "w");

  // ---------------- SECTION 5 · STYLE ----------------
  tileset.style = makeStyle();
  styledTilesets.push(tileset);

  // ---------------- SECTION 6 · FILES + LEVELS (model tree) ----------------
  log("Step 4/8 · Reading files from the model tree…");
  elementService = Cesium.IonAssetElementService.fromAssetId(TILESET_ASSET_ID);
  await buildFileTree();

  // ---------------- SECTION 7 · CLICK-TO-LEARN ----------------
  log("Step 5/8 · Setting up click-to-learn…");
  const infoEntity = viewer.entities.add(new Cesium.Entity({ show: false }));
  function propertiesTable(props) {
    return `<table class="cesium-infoBox-defaultTable"><tbody>${Object.entries(props).map(([k, p]) => {
      const tr = document.createElement("tr");
      const b = document.createElement("b");
      b.textContent = k;
      tr.insertCell().appendChild(b);
      tr.insertCell().textContent = String(p?.displayValue ?? p?.value ?? p);
      return tr.outerHTML;
    }).join("")}</tbody></table>`;
  }
  async function depthOfCover(pos) {
    if (!Cesium.defined(pos)) return undefined;
    const c = Cesium.Cartographic.fromCartesian(pos);
    const g = new Cesium.Cartographic(c.longitude, c.latitude, 0);
    const [s] = await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, [g]);
    return s.height - c.height;
  }
  function depthHtml(d) {
    if (d === undefined || !isFinite(d)) return "";
    const ft = Math.abs(d) * 3.28084;
    const word = d >= 0 ? "below" : "above";
    return `<p style="margin:4px 0 8px;padding:6px 8px;border-left:4px solid ${RSH.golden};background:${RSH.lightBlueTint};color:${RSH.navy}">` +
      `<b>Depth at the point you clicked:</b> ${ft.toFixed(1)} ft (${Math.abs(d).toFixed(2)} m) ${word} ground` +
      `<br><small>Measured against Cesium World Terrain, not your design surface.</small></p>`;
  }
  async function fetchElement(id) {
    try {
      return await elementService.getElement(id);
    } catch (err) {
      log(`Element ${id} not on ${TILESET_ASSET_ID} (${err.message}); trying ${DATABASE_ASSET_ID}…`, "w");
      return await Cesium.IonAssetElementService.fromAssetId(DATABASE_ASSET_ID).getElement(id);
    }
  }
  viewer.screenSpaceEventHandler.setInputAction(async (move) => {
    // Tools that are waiting for a click on the map
    if (pickMode === "cut") { placeCutAt(move.position); return; }
    if (pickMode === "road1" || pickMode === "road2") { roadClick(move.position); return; }
    if (pickMode === "under") { goUnderAt(move.position); return; }
    const mine = ++activeClick;
    const hit = pickNear(viewer.scene, move.position);
    const feature = hit?.feature;
    const id = feature ? Cesium.IonAssetElementService.getElementId(feature) : undefined;
    clearHits();
    if (id === undefined) {
      selectedElementId = undefined;
      refresh();
      viewer.selectedEntity = undefined;
      return;
    }
    selectedElementId = id;
    refresh();
    const c = norm(feature.getProperty("category"));
    const f = catToFile.get(c);
    const lvl = catLabel.get(c);
    const clickPos = hit?.position;
    const depthP = depthOfCover(clickPos).catch((err) => {
      log(`Depth of cover unavailable: ${err.message}`, "w");
      return undefined;
    });
    const where = [f?.label, lvl].filter(Boolean).join(" › ");
    revealInPanel(f, c);
    infoEntity.name = where || `Element ${id}`;
    infoEntity.description = "Loading…";
    infoEntity.show = true;
    viewer.selectedEntity = infoEntity;
    try {
      const e = await fetchElement(id);
      if (mine !== activeClick) return;
      if (e?.label) infoEntity.name = e.label + (where ? `  (${where})` : "");
      const depth = await depthP;
      if (mine !== activeClick) return;
      infoEntity.description = depthHtml(depth) + propertiesTable(e?.properties ?? {});
      log(`Clicked: ${infoEntity.name}` + (depth !== undefined ? ` · depth ${(depth * 3.28084).toFixed(1)} ft` : ""));
    } catch (err) {
      if (mine !== activeClick) return;
      infoEntity.description = `<p style="color:${RSH.plum}">Couldn't load properties: ${err.message}</p>`;
      log(`Click-to-learn failed for ${id}: ${err.message}`, "e");
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
  log("Click any piece of the model to see its info.", "ok");

  // ---------------- SECTION 8 · GROUND (X-ray + Go underground) ----------------
  // X-ray: off → on (whole ground) → close up only → off. "Close up only" uses
  // GlobeTranslucency frontFaceAlphaByDistance (see-through near the camera).
  log("Step 6/8 · Ground controls…");
  const XRAY_MODES = ["off", "on", "close up only"];
  let xrayMode = "off";
  let groundPct = GROUND_START_PERCENT;
  const xray = el("button", "X-ray: off", groundRow, "b");
  xray.title = "Click to change: off → on → close up only";
  const under = el("button", "Go underground", groundRow, "b");
  const sliderLabel = el("div", "Ground opacity", groundRow);
  sliderLabel.style.marginTop = "6px";
  const pct = el("span", "", sliderLabel, "val");
  const slider = el("input", undefined, groundRow);
  slider.type = "range"; slider.min = 0; slider.max = 100; slider.step = 1;
  slider.value = GROUND_START_PERCENT;

  function applyGround() {
    const on = xrayMode !== "off";
    globe.translucency.enabled = on;
    const a = groundPct / 100;
    if (xrayMode === "close up only") {
      // Cesium multiplies the constant alpha by the by-distance alpha, so keep the constant at 1
      globe.translucency.frontFaceAlpha = 1.0;
      globe.translucency.backFaceAlpha = 1.0;
      globe.translucency.frontFaceAlphaByDistance = new Cesium.NearFarScalar(XRAY_CLOSE_METERS, a, XRAY_CLOSE_METERS * 2, 1.0);
      globe.translucency.backFaceAlphaByDistance = new Cesium.NearFarScalar(XRAY_CLOSE_METERS, a, XRAY_CLOSE_METERS * 2, 1.0);
    } else {
      globe.translucency.frontFaceAlphaByDistance = undefined;
      globe.translucency.backFaceAlphaByDistance = undefined;
      globe.translucency.frontFaceAlpha = a;
      globe.translucency.backFaceAlpha = a;
    }
    xray.textContent = "X-ray: " + xrayMode;
    xray.classList.toggle("on", on);
    pct.textContent = groundPct + "%" + (xrayMode === "close up only" ? ` within ${XRAY_CLOSE_METERS} m` : "");
  }
  function setXrayMode(mode) {
    xrayMode = mode;
    applyGround();
  }
  xray.onclick = () => {
    setXrayMode(XRAY_MODES[(XRAY_MODES.indexOf(xrayMode) + 1) % XRAY_MODES.length]);
    log("X-ray " + xrayMode + (xrayMode === "close up only" ? ` (see-through within ${XRAY_CLOSE_METERS} m of you)` : ""));
  };
  slider.oninput = () => {
    groundPct = Number(slider.value);
    if (xrayMode === "off") xrayMode = "on";
    applyGround();
  };
  slider.onchange = () => log(`Ground opacity ${groundPct}%`);
  applyGround();

  // Go underground → click a spot → you're under it; button becomes "Back up"
  let aboveView = null;   // where you were before going under
  function updateUnderBtn() {
    under.textContent = aboveView ? "Back up" : "Go underground";
    under.title = aboveView ? "Fly back to where you were before going underground" : "Then click the spot you want to go under";
    under.classList.toggle("on", pickMode === "under" || !!aboveView);
  }
  under.onclick = () => {
    if (aboveView) {
      const v = aboveView;
      aboveView = null;
      stopOrbit();
      setXrayMode("off");
      viewer.scene.screenSpaceCameraController.enableCollisionDetection = true;
      viewer.camera.flyTo({ destination: v.destination, orientation: { heading: v.heading, pitch: v.pitch, roll: v.roll }, duration: 2 });
      updateUnderBtn();
      log("Back up: returned to where you were.");
      return;
    }
    if (pickMode === "under") { setPickMode(null); updateUnderBtn(); log("Go underground cancelled"); return; }
    setPickMode("under", "Click the spot you want to go under");
    updateUnderBtn();
    log("Go underground: click the spot you want to be under…");
  };
  async function goUnderAt(screenPos) {
    let p = viewer.scene.pickPosition(screenPos);
    if (!Cesium.defined(p)) p = globe.pick(viewer.camera.getPickRay(screenPos), viewer.scene);
    if (!Cesium.defined(p)) { showHint("Nothing there — click on the model or the ground"); log("Couldn't find a spot there — click on the model or the ground.", "w"); return; }
    setPickMode(null);
    const c = Cesium.Cartographic.fromCartesian(p);
    let ground = c.height;
    try {
      const [s] = await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, [new Cesium.Cartographic(c.longitude, c.latitude)]);
      if (Cesium.defined(s.height)) ground = s.height;
    } catch (err) { log(`Ground height unavailable (${err.message}); using the clicked height`, "w"); }
    const cam = viewer.camera;
    aboveView = { destination: Cesium.Cartesian3.clone(cam.positionWC), heading: cam.heading, pitch: cam.pitch, roll: cam.roll };
    updateUnderBtn();
    if (xrayMode === "off") setXrayMode("on");
    viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;
    // Stand back from the spot (opposite the way you're facing) and look at it from below
    const h = cam.heading;
    const enu = Cesium.Transforms.eastNorthUpToFixedFrame(Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, ground));
    const local = new Cesium.Cartesian3(-Math.sin(h) * UNDERGROUND_BACKOFF_M, -Math.cos(h) * UNDERGROUND_BACKOFF_M, -UNDERGROUND_DEPTH_M);
    const dest = Cesium.Matrix4.multiplyByPoint(enu, local, new Cesium.Cartesian3());
    cam.flyTo({ destination: dest, orientation: { heading: h, pitch: Cesium.Math.toRadians(8), roll: 0 }, duration: 2 });
    log(`Going underground: ${UNDERGROUND_DEPTH_M} m below ground, ${UNDERGROUND_BACKOFF_M} m back from the spot. WASD to walk, Back up to return.`);
  }
  updateUnderBtn();

  // ---------------- SECTION 8b · CLIP GROUND (Clipping assist footprint) ----------------
  // Cuts Cesium World Terrain + imagery under the model footprint, like the iModel
  // viewer's map masking. Cesium's ClippingPolygon has no "holes" option, so each
  // footprint part with holes (the grass inside loops) is turned into ONE outline
  // that runs out to each hole and back along a zero-width "bridge". The hole
  // areas are then outside the polygon, so the ground there stays.
  log("Step 6b · Clip ground…");
  const clipBtn = el("button", "Clip ground: loading…", clipRow, "b");
  clipBtnRef = clipBtn;
  clipBtn.title = "Cut the ground/map away under the model";
  await loadClipGround();
  clipBtn.onclick = () => {
    if (!clipCollection) return log("Clip ground isn't loaded (see the error above).", "w");
    clipCollection.enabled = !clipCollection.enabled;
    setClipButtons();
    log("Clip ground " + (clipCollection.enabled ? "on" : "off"));
  };

  async function loadClipGround() {
    if (Cesium.ClippingPolygonCollection.isSupported && !Cesium.ClippingPolygonCollection.isSupported(viewer.scene)) {
      clipBtn.textContent = "Clip ground: not supported";
      log("Clip ground needs WebGL 2 — this browser/graphics card can't do clipping polygons.", "e");
      return;
    }
    try {
      const resource = await Cesium.IonResource.fromAssetId(CLIP_ASSET_ID);
      // not clamped: we only need the shape (also avoids the "outlines unsupported on terrain" warning)
      const ds = await Cesium.GeoJsonDataSource.load(resource, { clampToGround: false });
      const now = Cesium.JulianDate.now();
      const polys = [];
      let holeCount = 0, vertexCount = 0;
      ds.entities.values.forEach((ent) => {
        if (!ent.polygon) return;
        const h = ent.polygon.hierarchy.getValue(now);
        if (!h || !h.positions || h.positions.length < 3) return;
        const holes = (h.holes || []).map((x) => x.positions).filter((p) => p && p.length >= 3);
        holeCount += holes.length;
        const ring = KEEP_FOOTPRINT_HOLES && holes.length ? bridgeHoles(h.positions, holes) : h.positions;
        vertexCount += ring.length;
        polys.push(new Cesium.ClippingPolygon({ positions: ring }));
      });
      if (!polys.length) throw new Error("the footprint asset has no polygons in it");
      clipCollection = new Cesium.ClippingPolygonCollection({ polygons: polys, enabled: CLIP_GROUND_ON_START });
      globe.clippingPolygons = clipCollection;
      setClipButtons();
      log(`Clip ground ready: ${polys.length} polygon(s), ${holeCount} hole(s) ` +
        (KEEP_FOOTPRINT_HOLES ? "kept (grass inside loops stays)" : "ignored (whole outline cut)") +
        `, ${vertexCount} points · ${CLIP_GROUND_ON_START ? "on" : "off"} at start`, "ok");
    } catch (err) {
      clipBtn.textContent = "Clip ground: failed";
      log(`Clip ground failed: ${err.message}. If it mentions 401/404, add asset ${CLIP_ASSET_ID} ` +
        "to the token's Selected assets (ion > Access Tokens) and check the footprint finished tiling.", "e");
    }
  }

  // ---------------- SECTION 8c · CROSS-SECTION (clipping planes) ----------------
  // Place cut → click the model: a vertical cut goes through that point, facing the
  // way the camera looks. Cut across road → two clicks along the road: the cut
  // goes square to the road. Planes are built in a frame at the cut point and
  // converted into the tileset's clipping frame.
  log("Step 6c · Cross-section tool…");
  const placeBtn = el("button", "Place cut", cutRow, "b");
  placeBtn.title = "Then click a point on the model";
  const clearCutBtn = el("button", "Remove cut", cutRow, "b");
  const roadBtn = el("button", "Cut across road", cutRow, "b");
  roadBtn.title = "Then click two points along the road (the way cars drive)";
  const faceBtn = el("button", "Face camera", cutRow, "b");
  faceBtn.title = "Turn the cut to face the way you're looking";
  const sliceBtn = el("button", "Section only: off", cutRow, "b");
  sliceBtn.title = "Keep only a thin strip at the cut";
  const soilBtn = el("button", "Soil fill: off", cutRow, "b");
  soilBtn.title = "Colour the cut face below the ground line";
  const secBtn = el("button", "Section window", cutRow, "b");
  secBtn.title = "Open a flat side view of the cut, with measuring";
  function sliderRow(label, min, max, step, value) {
    const lab = el("div", label, cutRow);
    lab.style.marginTop = "6px";
    const val = el("span", "", lab, "val");
    const input = el("input", undefined, cutRow);
    input.type = "range"; input.min = min; input.max = max; input.step = step; input.value = value;
    return { input, val };
  }
  const rotS = sliderRow("Rotate", -180, 180, 1, 0);
  const slideS = sliderRow("Slide", -CUT_SLIDE_METERS, CUT_SLIDE_METERS, 0.5, 0);
  const thickS = sliderRow("Thickness (Section only)", 1, 50, 0.5, SLICE_START_METERS);
  const cut = { on: false, point: undefined, heading: 0, offset: 0, slice: false, thickness: SLICE_START_METERS, soil: SOIL_FILL_ON_START, leftFt: CUT_LEFT_FT, rightFt: CUT_RIGHT_FT };
  // Left / Right width: number box + slider, in feet
  function widthRow(label, key) {
    const lab = el("div", label, cutRow);
    lab.style.cssText = "margin-top:6px;display:flex;align-items:center;gap:6px";
    const num = el("input", undefined, lab);
    num.type = "number"; num.min = 1; num.max = 5000; num.step = 1; num.value = cut[key];
    num.style.cssText = "width:70px;margin-left:auto;border:1px solid #85C7EE;border-radius:6px;padding:2px 4px";
    el("span", "ft", lab);
    const range = el("input", undefined, cutRow);
    range.type = "range"; range.min = 5; range.max = 1000; range.step = 5; range.value = cut[key];
    const set = (v, from) => {
      v = Math.max(1, Math.min(5000, Number(v) || 1));
      cut[key] = v;
      if (from !== num) num.value = v;
      if (from !== range) range.value = Math.min(v, 1000);
      applyCut();
    };
    num.oninput = () => set(num.value, num);
    range.oninput = () => set(range.value, range);
    const done = () => cut.on && log(`Cut width: L ${cut.leftFt} ft / R ${cut.rightFt} ft`);
    num.onchange = done; range.onchange = done;
  }
  widthRow("Left width", "leftFt");
  widthRow("Right width", "rightFt");
  let tilesetCut, globeCut, cutOutline, soilWall, soilTimer, roadFirst;

  function wrapDeg(d) { return ((d + 540) % 360) - 180; }
  function refreshLabels() {
    rotS.val.textContent = `${Math.round(cut.heading)}°`;
    slideS.val.textContent = `${cut.offset.toFixed(1)} m (${(cut.offset * 3.28084).toFixed(0)} ft)`;
    thickS.val.textContent = `${cut.thickness} m (${(cut.thickness * 3.28084).toFixed(1)} ft)`;
    sliceBtn.textContent = "Section only: " + (cut.slice ? "on" : "off");
    sliceBtn.classList.toggle("on", cut.slice);
    soilBtn.textContent = "Soil fill: " + (cut.soil ? "on" : "off");
    soilBtn.classList.toggle("on", cut.soil);
    placeBtn.classList.toggle("on", pickMode === "cut");
    roadBtn.classList.toggle("on", pickMode === "road1" || pickMode === "road2");
  }
  function applyCut() {
    refreshLabels();
    if (!cut.on || !cut.point) return;
    const enu = cutFrame(cut);
    if (!tilesetCut) { tilesetCut = newPlaneCollection(cut, cut.slice); tileset.clippingPlanes = tilesetCut; }
    if (!globeCut) { globeCut = newPlaneCollection(cut, cut.slice); globe.clippingPlanes = globeCut; }
    updatePlaneCollection(tilesetCut, toTilesetFrame(tileset, enu), cut, cut.slice);
    updatePlaneCollection(globeCut, enu, cut, cut.slice);
    // golden outline showing where the cut is
    const n = cutNormal(cut);
    const { L, R } = cutWidths(cut);
    const h = Cesium.Math.toRadians(cut.heading);
    const mid = (R - L) / 2;   // the rectangle is centred between the left and right limits
    const center = Cesium.Matrix4.multiplyByPoint(enu,
      new Cesium.Cartesian3(n.x * cut.offset + Math.cos(h) * mid, n.y * cut.offset - Math.sin(h) * mid, 0), new Cesium.Cartesian3());
    const dims = new Cesium.Cartesian2(L + R, 40);
    if (!cutOutline) {
      cutOutline = viewer.entities.add({
        position: center,
        plane: { plane: new Cesium.Plane(n, 0), dimensions: dims, fill: false, outline: true, outlineColor: goldenColor },
      });
    } else {
      cutOutline.position = center;
      cutOutline.plane.plane = new Cesium.Plane(n, 0);
      cutOutline.plane.dimensions = dims;
      cutOutline.show = true;
    }
    scheduleSoil();
    if (sectionOpen) syncSection(false);
  }
  // Soil fill: a brown wall along the cut, from the ground line down SOIL_DEPTH_METERS
  function scheduleSoil() {
    clearTimeout(soilTimer);
    soilTimer = setTimeout(async () => {
      if (!cut.on || !cut.soil) { if (soilWall) soilWall.show = false; return; }
      try {
        const { positions, maxH, minH } = await soilProfile(viewer, cut);
        if (!soilWall) {
          soilWall = viewer.entities.add({ wall: { positions, maximumHeights: maxH, minimumHeights: minH,
            material: Cesium.Color.fromCssColorString(SOIL_COLOR).withAlpha(0.8) } });
        } else {
          soilWall.wall.positions = positions;
          soilWall.wall.maximumHeights = maxH;
          soilWall.wall.minimumHeights = minH;
          soilWall.show = true;
        }
      } catch (err) { log(`Soil fill failed: ${err.message}`, "w"); }
    }, 200);
  }
  function startCut(point, headingDeg, how) {
    cut.point = point;
    cut.on = true;
    cut.offset = 0; slideS.input.value = 0;
    cut.heading = wrapDeg(headingDeg);
    rotS.input.value = Math.round(cut.heading);
    if (tilesetCut) tilesetCut.enabled = true;
    if (globeCut) globeCut.enabled = true;
    applyCut();
    const c = Cesium.Cartographic.fromCartesian(point);
    log(`Cut placed (${how}) at ${Cesium.Math.toDegrees(c.latitude).toFixed(6)}, ${Cesium.Math.toDegrees(c.longitude).toFixed(6)}, ` +
      `facing ${Math.round(cut.heading)}° · tileset frame: ${tileset.clippingPlanesOriginMatrix ? "root" : "bounding sphere (fallback)"}`, "ok");
  }
  function placeCutAt(screenPos) {
    const p = pickNear(viewer.scene, screenPos)?.position;
    if (!Cesium.defined(p)) { showHint("Nothing there — click directly on the model"); log("Couldn't find a point there — click directly on the model (or the ground).", "w"); return; }
    setPickMode(null);
    startCut(p, Cesium.Math.toDegrees(viewer.camera.heading), "facing camera");
  }
  function roadClick(screenPos) {
    const hit = pickNear(viewer.scene, screenPos);
    const p = hit?.position;
    if (!Cesium.defined(p)) { showHint("Nothing there — click on the road or its alignment"); return; }
    if (pickMode === "road1") {
      roadFirst = p;
      const lvl = hit.feature instanceof Cesium.Cesium3DTileFeature ? catLabel.get(norm(hit.feature.getProperty("category"))) : undefined;
      if (lvl) log(`First point on ${lvl}`);
      setPickMode("road2", "Now click a second point further along the road (same direction cars drive)");
      refreshLabels();
      return;
    }
    // second point: road direction from point 1 to point 2, measured at point 2
    const inv = Cesium.Matrix4.inverseTransformation(Cesium.Transforms.eastNorthUpToFixedFrame(p), new Cesium.Matrix4());
    const a = Cesium.Matrix4.multiplyByPoint(inv, roadFirst, new Cesium.Cartesian3());
    const dx = -a.x, dy = -a.y;   // from point 1 to point 2 (point 2 is the origin)
    if (Math.hypot(dx, dy) < 0.5) { showHint("Those points are too close — click a second point a few metres away"); return; }
    setPickMode(null);
    startCut(p, Cesium.Math.toDegrees(Math.atan2(dx, dy)), "across road");
    log("Slide now moves the cut along the road (like stepping through stations).");
  }
  placeBtn.onclick = () => {
    if (pickMode === "cut") { setPickMode(null); refreshLabels(); log("Place cut cancelled"); return; }
    setPickMode("cut", "Click a point on the model to place the cut");
    refreshLabels();
    log("Place cut: click a point on the model…");
  };
  roadBtn.onclick = () => {
    if (pickMode === "road1" || pickMode === "road2") { setPickMode(null); refreshLabels(); log("Cut across road cancelled"); return; }
    setPickMode("road1", "Click the first point on the road (or its alignment)");
    refreshLabels();
    log("Cut across road: click two points along the road, one behind the other…");
  };
  faceBtn.onclick = () => {
    if (!cut.on) return log("Place a cut first.", "w");
    cut.heading = wrapDeg(Cesium.Math.toDegrees(viewer.camera.heading));
    rotS.input.value = Math.round(cut.heading);
    applyCut();
    log(`Cut now faces ${Math.round(cut.heading)}°`);
  };
  sliceBtn.onclick = () => { cut.slice = !cut.slice; applyCut(); log(cut.slice ? `Section only on: keeping a ${cut.thickness} m strip` : "Section only off: single cut"); };
  soilBtn.onclick = () => {
    cut.soil = !cut.soil;
    refreshLabels();
    scheduleSoil();
    if (sectionOpen) syncSection(false);
    log("Soil fill " + (cut.soil ? "on" : "off"));
  };
  clearCutBtn.onclick = () => {
    cut.on = false;
    setPickMode(null);
    if (tilesetCut) tilesetCut.enabled = false;
    if (globeCut) globeCut.enabled = false;
    if (cutOutline) cutOutline.show = false;
    if (soilWall) soilWall.show = false;
    closeSection();
    refreshLabels();
    log("Cut removed");
  };
  rotS.input.oninput = () => { cut.heading = Number(rotS.input.value); applyCut(); };
  slideS.input.oninput = () => { cut.offset = Number(slideS.input.value); applyCut(); };
  thickS.input.oninput = () => { cut.thickness = Number(thickS.input.value); applyCut(); };
  [rotS, slideS, thickS].forEach((s) => (s.input.onchange = () => {
    if (cut.on) log(`Cut: ${Math.round(cut.heading)}°, slide ${cut.offset.toFixed(1)} m` + (cut.slice ? `, strip ${cut.thickness} m` : ""));
  }));
  refreshLabels();

  // ---------------- SECTION 8d · SECTION WINDOW (flat wireframe view + grid + measure) ----------------
  // A second Cesium viewer in its own window, looking straight at the cut. The
  // camera sits SEC_DIST metres back with a very narrow field of view, so the
  // picture is flat like a drawing. Cesium's own mouse controls are off; scroll =
  // zoom, drag = move. The model is drawn as WIREFRAME (Cesium3DTileset
  // debugWireframe) inside a strip around the cut, cut to your Left/Right widths.
  // The ground is drawn as a line sampled from Cesium World Terrain. A grid with

  const SEC_DIST = 3000;
  const secWin = document.createElement("div");
  secWin.id = "mi4Sec";
  secWin.innerHTML = `<div class="sh"><span class="t">Section</span>
      <button class="b" data-a="h">Horizontal</button><button class="b" data-a="v">Vertical</button>
      <button class="b" data-a="s">Slope</button><button class="b" data-a="clear">Clear</button>
      <button class="b" data-a="layers">Layers</button><button class="b" data-a="fit">Fit</button><span class="sp"></span><button class="mi4i" data-a="info">How?</button>
      <button class="x" data-a="close">✕</button></div>
    <div class="mi4info">${INFO.section}</div>
    <div class="sbw"><div class="sb"></div><div class="lay"></div></div>
    <div class="res">Scroll to zoom, drag to move. Pick Horizontal, Vertical or Slope to measure.</div>`;
  viewer.container.appendChild(secWin);
  const secTitle = secWin.querySelector(".t");
  const secBody = secWin.querySelector(".sb");
  const secLay = secWin.querySelector(".lay");
  const secRes = secWin.querySelector(".res");
  const secInfo = secWin.querySelector(".mi4info");
  const layersBtn = secWin.querySelector('[data-a="layers"]');
  const MEASURE = { h: "Horizontal", v: "Vertical", s: "Slope" };
  const measureBtns = { h: secWin.querySelector('[data-a="h"]'), v: secWin.querySelector('[data-a="v"]'), s: secWin.querySelector('[data-a="s"]') };
  let v2, v2Tiles, v2TilesCut, v2GlobeCut, v2Ground, gridCanvas, snapMarker, lastSnap, groundTimer, lastSnapTime = 0;
  let sectionOpen = false, measureMode = null;
  let measurePts = [];
  let groundMidH;                                   // ground height at the cut (for Fit)
  const measureEntities = [];
  const secView = { width: 100, s: 0, z: 0 };
  const secHidden = new Set();                      // files hidden in the section window only
  const secShow = { groundLine: true, groundSurface: false, grid: true, measure: true };
  let secStrip = SECTION_STRIP_METERS;

  // drag the window by its header
  (() => {
    const bar = secWin.querySelector(".sh");
    let sx, sy, ox, oy, dragging = false;
    bar.addEventListener("mousedown", (e) => {
      if (e.target.tagName === "BUTTON") return;
      dragging = true; sx = e.clientX; sy = e.clientY;
      const r = secWin.getBoundingClientRect(), pr = viewer.container.getBoundingClientRect();
      ox = r.left - pr.left; oy = r.top - pr.top;
      e.preventDefault();
    });
    document.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      secWin.style.left = ox + e.clientX - sx + "px";
      secWin.style.top = oy + e.clientY - sy + "px";
      secWin.style.right = "auto";
    });
    document.addEventListener("mouseup", () => (dragging = false));
  })();

  secWin.querySelector('[data-a="close"]').onclick = () => closeSection();
  secWin.querySelector('[data-a="fit"]').onclick = () => { fitSection(); log("Section view fitted to the cut width"); };
  secWin.querySelector('[data-a="clear"]').onclick = () => clearMeasure();
  secWin.querySelector('[data-a="info"]').onclick = (e) => {
    const open = !secInfo.classList.contains("open");
    secInfo.classList.toggle("open", open);
    e.target.classList.toggle("on", open);
  };
  layersBtn.onclick = () => {
    const open = !secLay.classList.contains("open");
    secLay.classList.toggle("open", open);
    layersBtn.classList.toggle("on", open);
    setTimeout(() => placeSecCamera(), 50);
  };
  Object.entries(measureBtns).forEach(([mode, btn]) => (btn.onclick = () => setMeasureMode(measureMode === mode ? null : mode)));
  function setMeasureMode(mode) {
    measureMode = mode;
    measurePts = [];
    lastSnap = undefined;
    if (snapMarker) snapMarker.show = false;
    Object.entries(measureBtns).forEach(([m, b]) => b.classList.toggle("on", m === mode));
    if (v2) v2.canvas.style.cursor = mode ? "crosshair" : "";
    if (mode) {
      showHint(`${MEASURE[mode]}: click the first point in the section window (it snaps to nearby lines)`);
      secRes.textContent = `${MEASURE[mode]}: click the first point…`;
    } else {
      if (!pickMode) hideHint();
      secRes.textContent = "Measure off.";
    }
  }
  secBtn.onclick = async () => {
    if (!cut.on) return log("Place a cut first, then open the section window.", "w");
    if (sectionOpen) { closeSection(); return; }
    await openSection();
  };

  // ---- Layers panel (section window only) ----
  function buildLayers() {
    secLay.innerHTML = "";
    const h = (t) => { const e = document.createElement("h4"); e.textContent = t; secLay.appendChild(e); };
    const box = (label, checked, onchange, color) => {
      const row = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox"; cb.checked = checked;
      cb.onchange = () => onchange(cb.checked);
      row.appendChild(cb);
      if (color) { const sw = document.createElement("span"); sw.className = "lsw"; sw.style.background = color; row.appendChild(sw); }
      row.appendChild(document.createTextNode(label));
      secLay.appendChild(row);
    };
    h("Files");
    files.forEach((f) => box(f.label, !secHidden.has(f), (on) => {
      on ? secHidden.delete(f) : secHidden.add(f);
      v2Tiles.makeStyleDirty();
      log(`Section window: ${f.label} ${on ? "on" : "off"}`);
    }, f.color));
    h("Show");
    box("Ground line (terrain)", secShow.groundLine, (on) => { secShow.groundLine = on; if (v2Ground) v2Ground.show = on; });
    box("Ground surface (solid)", secShow.groundSurface, (on) => { secShow.groundSurface = on; v2.scene.globe.show = on; });
    box("Grid + numbers", secShow.grid, (on) => { secShow.grid = on; drawGrid(); });
    box("Measurements", secShow.measure, (on) => { secShow.measure = on; measureEntities.forEach((e) => (e.show = on)); });
    h("Strip depth");
    const lab = document.createElement("div");
    const range = document.createElement("input");
    range.type = "range"; range.min = 0.5; range.max = 10; range.step = 0.1; range.value = secStrip;
    const showVal = () => (lab.textContent = `${secStrip.toFixed(1)} m (${(secStrip * 3.28084).toFixed(1)} ft) — thinner = flatter`);
    range.oninput = () => { secStrip = Number(range.value); showVal(); syncSection(false); };
    showVal();
    secLay.appendChild(lab);
    secLay.appendChild(range);
  }

  async function openSection() {
    secWin.style.display = "flex";
    sectionOpen = true;
    secBtn.classList.add("on");
    if (!v2) {
      log("Opening section window (loads the model a second time)…");
      try {
        v2 = new Cesium.Viewer(secBody, {
          terrain: Cesium.Terrain.fromWorldTerrain(),
          animation: false, timeline: false, baseLayerPicker: false, geocoder: false, homeButton: false,
          sceneModePicker: false, navigationHelpButton: false, infoBox: false, selectionIndicator: false,
          fullscreenButton: false, showRenderLoopErrors: false,
        });
        const s2 = v2.scene;
        s2.screenSpaceCameraController.enableInputs = false;   // our own zoom/pan (below)
        s2.screenSpaceCameraController.enableCollisionDetection = false;
        if (s2.skyAtmosphere) s2.skyAtmosphere.show = false;
        if (s2.skyBox) s2.skyBox.show = false;
        if (s2.sun) s2.sun.show = false;
        if (s2.moon) s2.moon.show = false;
        s2.fog.enabled = false;
        s2.backgroundColor = Cesium.Color.BLACK;
        s2.globe.show = secShow.groundSurface;                 // ground drawn as a line instead
        s2.globe.showGroundAtmosphere = false;
        s2.globe.baseColor = Cesium.Color.fromCssColorString("#3A3A3A");
        s2.globe.undergroundColor = Cesium.Color.BLACK;
        s2.renderError.addEventListener((sc, err) => {
          log(`Section window stopped drawing: ${err?.message ?? err}; restarting…`, "e");
          setTimeout(() => (v2.useDefaultRenderLoop = true), 300);
        });
        v2Tiles = await Cesium.Cesium3DTileset.fromIonAssetId(TILESET_ASSET_ID, { enableDebugWireframe: true });
        if (HEIGHT_NUDGE_METERS !== 0) v2Tiles.modelMatrix = Cesium.Matrix4.clone(tileset.modelMatrix);
        s2.primitives.add(v2Tiles);
        v2Tiles.debugWireframe = true;                          // always wireframe
        v2Tiles.style = makeStyle((f) => { const file = fileOf(f); return !!file && secHidden.has(file); });
        styledTilesets.push(v2Tiles);
        // grid overlay
        gridCanvas = document.createElement("canvas");
        gridCanvas.style.cssText = "position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3";
        secBody.appendChild(gridCanvas);
        // snap marker
        snapMarker = v2.entities.add({ show: false, position: Cesium.Cartesian3.ZERO,
          point: { pixelSize: 12, color: Cesium.Color.TRANSPARENT, outlineColor: goldenColor, outlineWidth: 3, disableDepthTestDistance: Number.POSITIVE_INFINITY } });
        v2.screenSpaceEventHandler.setInputAction((m) => measureClick(m.position), Cesium.ScreenSpaceEventType.LEFT_CLICK);
        v2.screenSpaceEventHandler.setInputAction((m) => snapHover(m.endPosition), Cesium.ScreenSpaceEventType.MOUSE_MOVE);
        wireSectionMouse();
        buildLayers();
        log("Section window ready (wireframe).", "ok");
      } catch (err) {
        log(`Section window failed: ${err.message}`, "e");
        return;
      }
    }
    syncSection(true);
  }
  function closeSection() {
    secWin.style.display = "none";
    sectionOpen = false;
    secBtn.classList.remove("on");
    if (measureMode) setMeasureMode(null);
  }
  // metres per screen pixel (Cesium's fov is horizontal when the view is wider than tall, else vertical)
  function secMpp() {
    const W = Math.max(secBody.clientWidth, 1), H = Math.max(secBody.clientHeight, 1);
    return secView.width / Math.max(W, H);
  }
  // scroll = zoom, drag = move (always square to the cut)
  function wireSectionMouse() {
    const c = v2.canvas;
    c.addEventListener("wheel", (e) => {
      e.preventDefault();
      secView.width = Math.min(Math.max(secView.width * (e.deltaY > 0 ? 1.15 : 1 / 1.15), 1), 3000);
      placeSecCamera();
    }, { passive: false });
    let drag = null;
    c.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; });
    window.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const mpp = secMpp();
      secView.s -= (e.clientX - drag.x) * mpp;
      secView.z += (e.clientY - drag.y) * mpp;
      drag = { x: e.clientX, y: e.clientY };
      placeSecCamera();
    });
    window.addEventListener("pointerup", () => (drag = null));
    new ResizeObserver(() => placeSecCamera()).observe(secBody);
  }
  function secAxes() {
    const enu = cutFrame(cut);
    const h = Cesium.Math.toRadians(cut.heading);
    const vec = (x, y, z) => Cesium.Cartesian3.normalize(Cesium.Matrix4.multiplyByPointAsVector(enu, new Cesium.Cartesian3(x, y, z), new Cesium.Cartesian3()), new Cesium.Cartesian3());
    return { enu, n: vec(Math.sin(h), Math.cos(h), 0), t: vec(Math.cos(h), -Math.sin(h), 0), up: vec(0, 0, 1), center: cutCenter(cut, enu) };
  }
  function fitSection() {
    const { L, R } = cutWidths(cut);
    const W = Math.max(secBody.clientWidth, 1), H = Math.max(secBody.clientHeight, 1);
    // make L+R (plus a margin) fit across the window
    secView.width = (L + R) * 1.12 * Math.max(W, H) / W;
    secView.s = (R - L) / 2;
    const h0 = Cesium.Cartographic.fromCartesian(cutCenter(cut, cutFrame(cut))).height;
    secView.z = groundMidH !== undefined ? groundMidH - h0 : 0;
    placeSecCamera();
  }
  function placeSecCamera() {
    if (!v2 || !cut.on || !sectionOpen) return;
    try {
      const { n, t, up, center } = secAxes();
      const target = Cesium.Cartesian3.clone(center);
      Cesium.Cartesian3.add(target, Cesium.Cartesian3.multiplyByScalar(t, secView.s, new Cesium.Cartesian3()), target);
      Cesium.Cartesian3.add(target, Cesium.Cartesian3.multiplyByScalar(up, secView.z, new Cesium.Cartesian3()), target);
      const dest = Cesium.Cartesian3.subtract(target, Cesium.Cartesian3.multiplyByScalar(n, SEC_DIST, new Cesium.Cartesian3()), new Cesium.Cartesian3());
      const cam = v2.camera;
      if (!(cam.frustum instanceof Cesium.PerspectiveFrustum)) cam.switchToPerspectiveFrustum();
      cam.frustum.fov = 2 * Math.atan(secView.width / 2 / SEC_DIST);
      cam.frustum.near = SEC_DIST * 0.5;
      cam.frustum.far = SEC_DIST * 3;
      cam.setView({ destination: dest, orientation: { direction: n, up } });
      drawGrid();
    } catch (err) {
      log(`Section camera failed: ${err.message}`, "e");
    }
  }
  // ORD-style grid: offsets along the bottom, elevations up the side, in feet
  function niceStep(x) {
    const steps = [0.5, 1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000];
    return steps.find((s) => s >= x) ?? 10000;
  }
  function drawGrid() {
    if (!gridCanvas) return;
    const W = secBody.clientWidth, H = secBody.clientHeight, dpr = window.devicePixelRatio || 1;

    g.clearRect(0, 0, W, H);

    const mppFt = secMpp() * FT;                       // feet per pixel
    const h0 = Cesium.Cartographic.fromCartesian(cutCenter(cut, cutFrame(cut))).height;

    const eMid = (h0 + secView.z) * FT + ELEVATION_OFFSET_FT;  // elevation (ft) at screen centre
    const step = niceStep(GRID_TARGET_PX * mppFt);
    const xOf = (off) => W / 2 + (off - sMid) / mppFt;
    const yOf = (el) => H / 2 - (el - eMid) / mppFt;
    g.font = "11px Segoe UI, system-ui, sans-serif";
    g.lineWidth = 1;
    const sMin = sMid - (W / 2) * mppFt, sMax = sMid + (W / 2) * mppFt;
    const eMin = eMid - (H / 2) * mppFt, eMax = eMid + (H / 2) * mppFt;
    const fmt = (v) => (Math.abs(v) < 1e-6 ? "0" : (step < 1 ? v.toFixed(1) : String(Math.round(v))));

    for (let o = Math.ceil(sMin / step) * step; o <= sMax; o += step) {
      const x = Math.round(xOf(o)) + 0.5;

      g.strokeStyle = zero ? "rgba(254,188,17,.55)" : "rgba(255,255,255,.13)";
      g.setLineDash(zero ? [6, 4] : []);
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H - 16); g.stroke();
      g.fillStyle = zero ? RSH.golden : "#9FB3C8";

      g.fillText(fmt(o) + "'", x, H - 4);

    g.setLineDash([]);

    for (let e = Math.ceil(eMin / step) * step; e <= eMax; e += step) {
      const y = Math.round(yOf(e)) + 0.5;
      g.strokeStyle = "rgba(255,255,255,.13)";
      g.beginPath(); g.moveTo(44, y); g.lineTo(W, y); g.stroke();
      g.fillStyle = "#9FB3C8";
      g.textAlign = "left";
      g.fillText(fmt(e), 4, y + 4);

    const { L, R } = cutWidths(cut);
    g.strokeStyle = "rgba(161,34,93,.8)";

    g.fillStyle = "rgba(0,0,0,.6)";
    g.fillRect(W - 210, 4, 206, 18);
    g.fillStyle = "#9FB3C8";

    evaluate(feature) {
      const c = norm(feature.getProperty("category"));
      if (c !== undefined && hiddenCats.has(c)) return false;

// ---------------- HELPERS · wider pick ----------------
// Clicks first try the exact pixel. If that misses the model, it checks a small
// area around the mouse (Scene.pick with width/height) and then rings of points
// out to PICK_RADIUS_PX, so thin lines like alignments are easy to hit.
function pickNear(scene, pos, anyObject) {
  const isModel = (f) => (anyObject ? Cesium.defined(f) : f instanceof Cesium.Cesium3DTileFeature);
  const exact = scene.pick(pos);
  if (isModel(exact)) {
    const p = scene.pickPosition(pos);
    if (Cesium.defined(p)) return { feature: exact, position: p };
  }
  const box = PICK_RADIUS_PX * 2 + 1;
  if (isModel(scene.pick(pos, box, box))) {
    for (let r = 2; r <= PICK_RADIUS_PX; r += 2) {
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2;
        const q = new Cesium.Cartesian2(pos.x + r * Math.cos(a), pos.y + r * Math.sin(a));
        const f = scene.pick(q);
        if (isModel(f)) {
          const p = scene.pickPosition(q);
          if (Cesium.defined(p)) return { feature: f, position: p };
        }
      }
    }
  }
  const p = scene.pickPosition(pos);
  return Cesium.defined(p) ? { feature: exact, position: p } : undefined;
}

// ---------------- HELPERS · footprint holes ("bridges") ----------------
// Joins each hole to the outer edge with a zero-width bridge so one outline
// excludes the hole. Holes are wound the opposite way to the outer edge, so the
// result is correct for both even-odd and non-zero fill rules.
function bridgeHoles(outer, holes) {
  const origin = outer[0];
  const inv = Cesium.Matrix4.inverseTransformation(Cesium.Transforms.eastNorthUpToFixedFrame(origin), new Cesium.Matrix4());
  const to2d = (p) => { const q = Cesium.Matrix4.multiplyByPoint(inv, p, new Cesium.Cartesian3()); return { x: q.x, y: q.y }; };
  const area = (pts) => { let a = 0; for (let i = 0; i < pts.length; i++) { const p = pts[i], q = pts[(i + 1) % pts.length]; a += p.x * q.y - q.x * p.y; } return a / 2; };
  let ring = outer.map((p) => ({ p, q: to2d(p) }));
  if (area(ring.map((v) => v.q)) < 0) ring.reverse();               // outer counter-clockwise
  const hs = holes.map((h) => {
    let r = h.map((p) => ({ p, q: to2d(p) }));
    if (area(r.map((v) => v.q)) > 0) r.reverse();                   // holes clockwise
    let k = 0;
    r.forEach((v, i) => { if (v.q.x > r[k].q.x) k = i; });          // rightmost hole point
    return { r, k };
  });
  hs.sort((a, b) => b.r[b.k].q.x - a.r[a.k].q.x);
  for (const { r, k } of hs) {
    const hp = r[k].q;
    let best = 0, bestD = Infinity;
    for (let j = 0; j < ring.length; j++) {
      const dx = ring[j].q.x - hp.x, dy = ring[j].q.y - hp.y, d = dx * dx + dy * dy;
      if (d < bestD) { bestD = d; best = j; }
    }
    const loop = [...r.slice(k), ...r.slice(0, k), r[k]];          // around the hole, back to start
    ring = [...ring.slice(0, best + 1), ...loop, ring[best], ...ring.slice(best + 1)];
  }
  return ring.map((v) => v.p);
}

// ---------------- HELPERS · cut geometry ----------------
function cutFrame(cut) {
  return Cesium.Transforms.eastNorthUpToFixedFrame(cut.point);
}
function cutNormal(cut) {
  const h = Cesium.Math.toRadians(cut.heading);   // 0 = facing north, 90 = facing east
  return new Cesium.Cartesian3(Math.sin(h), Math.cos(h), 0);
}
function cutCenter(cut, enu) {
  const n = cutNormal(cut);
  return Cesium.Matrix4.multiplyByPoint(enu, new Cesium.Cartesian3(n.x * cut.offset, n.y * cut.offset, 0), new Cesium.Cartesian3());
}
function buildPlanes(cut, slab) {
  const n = cutNormal(cut);
  if (!slab) return [new Cesium.ClippingPlane(n, -cut.offset)];     // keeps what's beyond the cut
  const half = cut.thickness / 2;
  return [
    new Cesium.ClippingPlane(n, -(cut.offset - half)),
    new Cesium.ClippingPlane(Cesium.Cartesian3.negate(n, new Cesium.Cartesian3()), cut.offset + half),
  ];
}
function newPlaneCollection(cut, slab) {
  return new Cesium.ClippingPlaneCollection({
    planes: buildPlanes(cut, slab), unionClippingRegions: true, edgeWidth: 2.0, edgeColor: goldenColor,
  });
}
function updatePlaneCollection(col, modelMatrix, cut, slab) {
  col.modelMatrix = modelMatrix;
  col.removeAll();
  buildPlanes(cut, slab).forEach((p) => col.add(p));
  col.enabled = true;
}
function toTilesetFrame(ts, enu) {
  const origin = ts.clippingPlanesOriginMatrix ?? Cesium.Transforms.eastNorthUpToFixedFrame(ts.boundingSphere.center);
  return Cesium.Matrix4.multiply(Cesium.Matrix4.inverse(origin, new Cesium.Matrix4()), enu, new Cesium.Matrix4());
}
// Ground line along the cut + a wall down SOIL_DEPTH_METERS (soil fill)
async function soilProfile(v, cut) {
  const { L, R } = cutWidths(cut);
  const pts = await terrainAlongCut(cut, -L, R, 100);
  return {
    positions: pts.map((p) => p.position),
    maxH: pts.map((p) => p.height - 0.05),            // just under the ground line
    minH: pts.map((p) => p.height - SOIL_DEPTH_METERS),
  };
}
// Ground heights along the cut line, from s = fromS to toS metres (s = along the cut, + = right)
async function terrainAlongCut(cut, fromS, toS, samples) {
  const enu = cutFrame(cut);
  const n = cutNormal(cut);
  const h = Cesium.Math.toRadians(cut.heading);
  const tx = Math.cos(h), ty = -Math.sin(h);
  const ss = [], carts = [];
  for (let i = 0; i <= samples; i++) {
    const s = fromS + ((toS - fromS) * i) / samples;
    const w = Cesium.Matrix4.multiplyByPoint(enu, new Cesium.Cartesian3(n.x * cut.offset + tx * s, n.y * cut.offset + ty * s, 0), new Cesium.Cartesian3());
    const c = Cesium.Cartographic.fromCartesian(w);
    ss.push(s);
    carts.push(new Cesium.Cartographic(c.longitude, c.latitude));
  }
  const sampled = await Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, carts);
  return sampled.map((c, i) => {
    const gh = Cesium.defined(c.height) ? c.height : 0;
    return { s: ss[i], height: gh, position: Cesium.Cartesian3.fromRadians(c.longitude, c.latitude, gh) };
  });
}
function cutWidths(cut) {
  return { L: cut.leftFt / 3.28084, R: cut.rightFt / 3.28084 };
}
// Section window planes: a strip of `depth` metres around the cut, limited to the Left/Right widths
function sectionPlanes(cut, depth) {
  const n = cutNormal(cut);
  const h = Cesium.Math.toRadians(cut.heading);
  const t = new Cesium.Cartesian3(Math.cos(h), -Math.sin(h), 0);
  const { L, R } = cutWidths(cut);
  const half = depth / 2;
  return [
    new Cesium.ClippingPlane(n, -(cut.offset - half)),
    new Cesium.ClippingPlane(Cesium.Cartesian3.negate(n, new Cesium.Cartesian3()), cut.offset + half),
    new Cesium.ClippingPlane(t, L),
    new Cesium.ClippingPlane(Cesium.Cartesian3.negate(t, new Cesium.Cartesian3()), R),
  ];
}

// ---------------- HELPERS · model tree → files panel ----------------
async function children(node) {
  try {
    const r = await elementService.getElementTreeChildren(node ? { nodeKey: node.key } : undefined);
    return r?.nodes ?? [];
  } catch (err) {
    const why = err?.response ? JSON.stringify(err.response) : err?.message;
    log(`Couldn't open "${node?.label ?? "root"}": ${why}`, "e");
    return [];
  }
}

async function buildFileTree() {
  const roots = await children();
  log("Tree top: " + (roots.map((n) => `${n.label} [${n.kind}]`).join(", ") || "(empty)"));
  if (!roots.length) {
    log("Model tree came back empty. Falling back to a flat level list.", "w");
    return buildFlatLevels();
  }
  let candidates = roots;
  if (roots.length === 1 && roots[0].kind === "subject" && roots[0].hasChildren) {
    candidates = await children(roots[0]);
    log(`Under "${roots[0].label}": ` + candidates.map((n) => `${n.label} [${n.kind}]`).join(", "));
  }
  const fileNodes = candidates.filter((n) => n.kind === "subject" || n.kind === "model");
  if (!fileNodes.length) {
    log("No file nodes found in the tree. Falling back to a flat level list.", "w");
    return buildFlatLevels();
  }
  // read every file's levels in parallel (faster first load)
  const results = await Promise.all(fileNodes.map(async (node) => {
    const levelMap = new Map();
    const addCats = (list) => list.filter((n) => n.kind === "category").forEach((n) => {
      const id = norm(n.id);
      if (!levelMap.has(id)) levelMap.set(id, n.label);
      if (!catLabel.has(id)) catLabel.set(id, n.label);
    });
    const kids = node.hasChildren ? await children(node) : [];
    addCats(kids);
    for (const k of kids.filter((n) => n.kind === "model" || n.kind === "subject")) {
      if (!k.hasChildren) continue;
      for (const g of await children(k)) {
        if (g.kind === "category") addCats([g]);
        else if (g.kind === "model" && g.hasChildren) addCats(await children(g));
      }
    }
    return { node, levelMap };
  }));
  let shared = 0;
  results.forEach(({ node, levelMap }, i) => {
    const color = FILE_COLORS[i % FILE_COLORS.length];
    const file = { label: node.label, color, cesiumColor: Cesium.Color.fromCssColorString(color), subjectId: norm(node.id), levels: [] };
    file.levels = [...levelMap].map(([id, label]) => ({ id, label })).sort((a, b) => a.label.localeCompare(b.label));
    file.levels.forEach((lv) => { if (catToFile.has(lv.id)) shared++; catToFile.set(lv.id, file); });
    files.push(file);
    log(`${file.label}: ${file.levels.length} level(s)`, file.levels.length ? "ok" : "w");
    renderFile(file);
  });
  if (shared) log(`${shared} level id(s) are shared between files — Colour by file uses the last file for those.`, "w");
  wireSearch();
}

function renderFile(file) {
  const d = el("details", undefined, fileList);
  file.details = d;
  const s = el("summary", undefined, d);
  el("span", "▶", s, "arw");
  const cb = el("input", undefined, s);
  cb.type = "checkbox"; cb.checked = true;
  cb.onclick = (e) => e.stopPropagation();
  cb.onchange = () => setFile(file, cb.checked);
  file.cb = cb;
  // colour square: click to pick this file's colour
  const sw = el("span", undefined, s, "sw");
  sw.style.background = file.color;
  sw.title = "Click to choose this file's colour";
  file.swatch = sw;
  const picker = document.createElement("input");
  picker.type = "color";
  picker.value = file.color.length === 7 ? file.color : "#215EAC";
  picker.style.cssText = "position:absolute;opacity:0;width:0;height:0;pointer-events:none";
  s.appendChild(picker);
  sw.onclick = (e) => { e.preventDefault(); e.stopPropagation(); picker.click(); };
  picker.onclick = (e) => e.stopPropagation();
  picker.oninput = () => {
    file.color = picker.value;
    file.cesiumColor = Cesium.Color.fromCssColorString(picker.value);
    sw.style.background = picker.value;
    if (!colorByFile) setColorByFile(true); else refresh();
  };
  picker.onchange = () => log(`${file.label} colour set to ${picker.value}`);
  el("span", file.label, s);
  el("span", `${file.levels.length} levels`, s, "cnt");
  file.levels.forEach((lv) => {
    const row = el("label", undefined, d, "lv");
    const lcb = el("input", undefined, row);
    lcb.type = "checkbox"; lcb.checked = true;
    el("span", lv.label, row);
    row.dataset.name = lv.label.toLowerCase();
    lv.row = row; lv.cb = lcb;
    lcb.addEventListener("click", (e) => {
      if (e.ctrlKey) {               // Ctrl+click = show only this level in this file
        e.preventDefault();
        const solo = file.levels.every((o) => o === lv || !o.cb.checked) && lv.cb.checked;
        file.levels.forEach((o) => setLevel(o, solo || o === lv));
        log(solo ? `${file.label}: all levels back on` : `${file.label}: only ${lv.label}`);
      } else setLevel(lv, lcb.checked);
      file.cb.checked = file.levels.some((o) => o.cb.checked);
      refresh();
    });
  });
}

// whole file on/off = all of its levels on/off (level ids are unique per file)
function setFile(file, visible) {
  file.levels.forEach((lv) => setLevel(lv, visible));
  file.cb.checked = visible;
  log(`${file.label} ${visible ? "on" : "off"}`);
  refresh();
}
function setLevel(lv, visible) {
  visible ? hiddenCats.delete(lv.id) : hiddenCats.add(lv.id);
  lv.cb.checked = visible;
}
function clearHits() {
  fileList.querySelectorAll(".lv.hit").forEach((r) => r.classList.remove("hit"));
}
function revealInPanel(file, catId) {
  if (!file) return;
  file.details.open = true;
  const lv = file.levels.find((l) => l.id === catId);
  const target = lv?.row ?? file.details;
  if (lv) lv.row.classList.add("hit");
  target.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function wireSearch() {
  search.oninput = () => {
    const q = search.value.toLowerCase();
    files.forEach((f) => {
      let any = false;
      f.levels.forEach((lv) => {
        const show = !q || lv.row.dataset.name.includes(q);
        lv.row.style.display = show ? "" : "none";
        any = any || (q && show);
      });
      if (q) f.details.open = any;
    });
  };
}
function buildFlatLevels() {
  const file = { label: "All levels", color: RSH.blue, cesiumColor: Cesium.Color.fromCssColorString(RSH.blue), levels: [] };
  file.levels = [...catLabel].map(([id, label]) => ({ id, label })).sort((a, b) => a.label.localeCompare(b.label));
  file.levels.forEach((lv) => catToFile.set(lv.id, file));
  files.push(file);
  renderFile(file);
  wireSearch();
  log(`Flat list: ${file.levels.length} levels.`, file.levels.length ? "ok" : "w");
}
